# ord-data is a data repository, not an installable package. This file declares
# the dependencies of the helper scripts under scripts/ and configures the
# tooling (pytest, ruff, ty) that runs against them.

[project]
name = "ord-data"
version = "0"
description = "Tooling for the Open Reaction Database data repository"
# Code in this repository is Apache-2.0. The datasets under data/ are
# CC-BY-SA-4.0 (see LICENSE); this field describes the code only.
license = "Apache-2.0"
license-files = ["LICENSE-CODE"]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.25.1",
    "pyyaml>=6.0",
]

[dependency-groups]
# Scripts that read or write ORD datasets need the schema library. These are a
# group rather than runtime dependencies so the mirror job, which only moves
# bytes, can `uv sync --no-dev` without pulling rdkit/pandas.
pipeline = [
    "ord-schema>=0.8.3",
    # process_dataset.py posts submission summaries back to a GitHub issue.
    "pygithub>=1.51",
]
dev = [
    { include-group = "pipeline" },
    "pre-commit>=4",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.15",
    "ty>=0.0.65",
]

[tool.uv]
# Virtual project: there is nothing to build or install from this repository.
package = false

[tool.pytest.ini_options]
# Tests sit beside the modules they cover (foo.py / foo_test.py), matching
# ord-schema. scripts/ is not a package, so pytest's prepend import mode puts
# the directory on sys.path and the bare-name imports resolve.
testpaths = ["scripts"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Ruleset mirrors ord-schema so the two repositories lint to one standard.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (likely bugs)
    "UP",   # pyupgrade (modernize syntax)
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations (argument, return, and Any-return types)
    "C4",   # flake8-comprehensions
    "COM",  # flake8-commas
    "ISC",  # flake8-implicit-str-concat
    "PT",   # flake8-pytest-style
    "TC",   # flake8-type-checking
    "RET",  # flake8-return
    "ICN",  # flake8-import-conventions
    "FURB", # refurb
    "PYI",  # flake8-pyi
    "PD",   # pandas-vet
    "NPY",  # numpy-specific
    "RUF",  # ruff-specific
    "TRY",  # tryceratops
    "EM",   # flake8-errmsg
    "FBT",  # flake8-boolean-trap
    "G",    # flake8-logging-format
    "PLC", "PLE", "PLR", "PLW",  # pylint
    "C90",  # mccabe complexity
    "PERF", # perflint
    "N",    # pep8-naming
    "SLF",  # flake8-self
    "DTZ",  # flake8-datetimez
    "BLE",  # flake8-blind-except
    "A",    # flake8-builtins
    "INP",  # flake8-no-pep420
    "T20",  # flake8-print
    "ERA",  # eradicate (commented-out code)
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "S",    # flake8-bandit
    "PTH",  # flake8-use-pathlib
    "D",    # pydocstyle (docstrings)
]
# Only rules that actually fire here are listed; ord-schema's longer list is
# tuned to code this repository does not have.
ignore = [
    # COM812 (missing trailing comma) and ISC001 (single-line implicit string
    # concat) conflict with the ruff formatter, which ruff recommends disabling
    # when running `ruff format`.
    "COM812",
    "ISC001",
    # These scripts are CLIs: print() is the output mechanism, and they shell
    # out to git and git-lfs with arguments this repository controls.
    "T201",
    "S603",
    "S607",
    # --- Adopted from ord-schema so the two repositories agree on style ---
    "TRY003",           # don't force custom exception classes for messages
    "EM101", "EM102",   # don't force a msg= variable before every raise
    "FBT001", "FBT002", # boolean positional args exist in these APIs already
    "C901", "PLR0912", "PLR0913", "PLR0915",  # complexity caps -> churn
    "G004",             # f-strings in logging calls are fine
    "PLR2004",          # "magic value" flags ordinary numeric literals
    # PTH207 (glob.glob -> Path.glob) flags CLIs that glob arbitrary
    # user-supplied patterns (--input_pattern, possibly absolute or recursive).
    # Path.glob requires a base dir plus a relative pattern and rejects absolute
    # patterns, so there is no clean equivalent.
    "PTH207",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# scripts/ holds top-level CLI modules, not a package.
"scripts/*.py" = ["INP001"]
# Skill helpers are standalone scripts run by hand, not a package either. S310
# flags urlopen on a URL it cannot prove is http(s): here that is a hardcoded
# hf.co constant and the Location header of the redirect it returns.
".claude/skills/**/*.py" = ["INP001", "S310"]
# Type annotations and docstrings add little on test functions and fixtures,
# assert is the point of a test, and reaching into module internals is fine
# there. Mirrors ord-schema.
"**/*_test.py" = ["ANN", "S101", "SLF001", "D"]

[tool.ty.src]
include = ["scripts"]

[tool.ty.environment]
# scripts/ is on sys.path at runtime (see tool.pytest.ini_options.pythonpath),
# so tests import its modules by bare name.
extra-paths = ["scripts"]
