# Runs ord-schema's validate_dataset.py over the repository's datasets: all of
# them when the validator or its environment changes, otherwise the ones a
# change adds or modifies. scripts/validation_scope.py holds the rule.
#
# Coverage rests on one pattern, data/*/*.parquet, and validate_dataset.py
# reports success over an empty match set -- so a dataset that pattern does not
# describe is published unchecked rather than rejected. Two jobs below assert
# their own reach before a green result means anything: check_layout pins down
# what may live under data/, and each validate_parquet leg requires a non-empty
# share of it whenever it validates the whole corpus.
#
# There is no standing sweep: a run follows every change to what the
# repository pins. A manual run covers what it does not pin, such as the Python
# patch release that uv picks for .python-version.

name: Validation

on:
  # What a run validates depends on what changed (see the scope job). These
  # paths are every input that can change a verdict.
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - '.github/workflows/validation.yml'
      - '.python-version'
      - 'uv.lock'
  pull_request:
    paths:
      - 'data/**'
      - '.github/workflows/validation.yml'
      - '.python-version'
      - 'uv.lock'
      - 'scripts/validation_scope.py'
  # Validates the chosen branch's whole corpus, main by default.
  workflow_dispatch:

# One in-flight matrix per PR: a new push cancels the run before it, so we are
# not paying twice for the LFS-heavy validate_parquet legs. That is safe there
# because a PR run scopes itself against the base and so covers everything the
# cancelled run would have. A push to main scopes itself against `before`, only
# what that push changed, so a cancelled push run would leave its datasets
# unchecked; each commit gets a group of its own instead.
#
# Keyed on the event as well: a manual run and a push of the same commit share
# a sha, so without it the push would cancel a run someone started by hand.
concurrency:
  group: validation-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# validate_dataset.py ships inside the ord_schema wheel, so validate_parquet
# runs it as a module out of the `pipeline` dependency group. It passes --validate_ids,
# matching what process_dataset.py checks at submission, so an id that stops being
# well-formed afterwards does not go unnoticed. uv.lock is therefore
# the only place the schema version is written down, and it is the same
# resolution the submission pipeline validates against: a dataset is checked
# against one version of the schema library whether it arrives by submission or
# is validated here.
jobs:
  # Decides whether the run validates the whole corpus, the datasets it adds or
  # modifies, or nothing. The script uses only the standard library, so it runs
  # on the runner's own interpreter with nothing installed.
  scope:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      datasets: ${{ steps.decide.outputs.datasets }}
    steps:
    - name: Checkout ord-data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: false
        # HEAD and its parent. On a pull request HEAD is the merge commit, and
        # its parent the base the pull request is compared against.
        fetch-depth: 2
    - name: Decide what to validate
      id: decide
      env:
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        BEFORE: ${{ github.event.before }}
      run: |
        python3 scripts/validation_scope.py scope \
          --event="${GITHUB_EVENT_NAME}" \
          --fork="${FORK}" \
          --before="${BEFORE}" \
          --github_output="${GITHUB_OUTPUT}"

  # Reads the index, not the objects, so it needs no LFS and is quick.
  # Runs alongside the shards rather than gating them: a layout the
  # shards do not cover should be reported together with whatever they did
  # manage to validate.
  check_layout:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ord-data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: false
    # Anything that is not a .parquet exactly one directory below data/ falls
    # outside the shards' input pattern. .gitattributes tracks .pb/.pb.gz under
    # data/, process_dataset.py leaves an edited dataset in the format it
    # already has, and --output_format can write one deliberately, so this is
    # reachable rather than theoretical.
    - name: Every dataset is Parquet at data/<xx>/
      run: |
        set -euo pipefail
        if stray="$(git ls-files -- data | grep -Ev '^data/[0-9a-f]{2}/[^/]+\.parquet$')"; then
          echo "::error::not covered by the data/*/*.parquet validation pattern:"
          printf '%s\n' "${stray}"
          exit 1
        fi
        echo "data/ holds $(git ls-files -- data | wc -l) Parquet datasets and nothing else"
    # Each shard proves it has work to do, but on its own that leaves the union
    # unchecked: one filter could go stale and drop its datasets while the other
    # still matches plenty, and both shards would stay green. Match every
    # dataset against every filter here, where the whole matrix is visible.
    - name: Shard filters cover every dataset exactly once
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import re
        import subprocess
        import sys

        workflow = ".github/workflows/validation.yml"
        with open(workflow) as handle:
            filters = re.findall(r"^ +filter: '(.+)'$", handle.read(), re.MULTILINE)
        if not filters:
            sys.exit(f"no shard filters found in {workflow}; did the matrix move?")
        files = subprocess.run(
            ["git", "ls-files", "--", "data"],
            capture_output=True, text=True, check=True,
        ).stdout.split()
        problems = [
            f"  {path}: matched by {n} of {len(filters)} shard filters"
            for path in files
            if (n := sum(bool(re.search(f, path)) for f in filters)) != 1
        ]
        print(f"{len(filters)} shard filters cover {len(files)} datasets exactly once")
        if problems:
            sys.exit("shard filters do not partition data/:\n" + "\n".join(problems))
        PY

  validate_parquet:
    name: validate_parquet (${{ matrix.name }})
    # Skips when scope finds nothing to validate, so no leg may become a
    # required check: a skipped required check blocks a merge.
    needs: scope
    if: needs.scope.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One leg per quarter of the hex range, keyed on the first character of
        # the data/<xx>/ directory -- the first hex digit of the dataset id.
        # Ids are random or hash-derived, so the corpus spreads across the legs
        # and a new dataset lands in one without editing this file.
        # No single dataset is large enough to set a leg's pace; within a leg,
        # validate_dataset.py fans out over files and row groups.
        include:
          - name: '0-3'
            filter: '^data/[0-3][0-9a-f]/[^/]+\.parquet$'
            lfs_include: 'data/[0-3]*/*.parquet'
          - name: '4-7'
            filter: '^data/[4-7][0-9a-f]/[^/]+\.parquet$'
            lfs_include: 'data/[4-7]*/*.parquet'
          - name: '8-b'
            filter: '^data/[89ab][0-9a-f]/[^/]+\.parquet$'
            lfs_include: 'data/[89ab]*/*.parquet'
          - name: 'c-f'
            filter: '^data/[c-f][0-9a-f]/[^/]+\.parquet$'
            lfs_include: 'data/[c-f]*/*.parquet'
    steps:
    - name: Checkout ord-data
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: false
    # The whole corpus takes the matrix entry as it stands. Changed datasets
    # narrow it to the ones this leg's filter selects, by exact path, and a leg
    # whose share is empty skips the rest. lfs_include is carried separately
    # from filter because filter is a regex handed to validate_dataset.py and
    # git lfs takes a path glob or a comma-separated list of paths.
    - name: Choose this leg's datasets
      id: leg
      env:
        MODE: ${{ needs.scope.outputs.mode }}
        DATASETS: ${{ needs.scope.outputs.datasets }}
        FILTER: ${{ matrix.filter }}
        LFS_INCLUDE: ${{ matrix.lfs_include }}
      run: |
        python3 scripts/validation_scope.py leg \
          --mode="${MODE}" \
          --datasets="${DATASETS}" \
          --filter="${FILTER}" \
          --lfs_include="${LFS_INCLUDE}" \
          --github_output="${GITHUB_OUTPUT}"
    # The whole corpus comes from the Hugging Face mirror that .lfsconfig names,
    # which spares GitHub's LFS bandwidth, and GitHub supplies whatever the
    # mirror lacks: it syncs only after a merge to main, so it may trail the
    # latest one. Changed datasets come straight from GitHub, since they are
    # never on the mirror yet. Either way git lfs checks each object against the
    # SHA-256 in its pointer, so neither store can serve bytes other than the
    # ones the commit names. The checkout step already configured GitHub
    # credentials.
    #
    # An empty lfs_include would read as no filter at all and quietly pull the
    # whole corpus, so require it.
    - name: Fetch LFS objects
      if: steps.leg.outputs.datasets != '0'
      env:
        LFS_INCLUDE: ${{ steps.leg.outputs.lfs_include }}
        STORE: ${{ steps.leg.outputs.store }}
      run: |
        set -euo pipefail
        : "${LFS_INCLUDE:?the leg step must set lfs_include}"
        github="https://github.com/${GITHUB_REPOSITORY}.git/info/lfs"
        case "${STORE}" in
          github)
            git config lfs.url "${github}"
            git lfs pull --include="${LFS_INCLUDE}"
            ;;
          huggingface)
            if ! git lfs pull --include="${LFS_INCLUDE}"; then
              echo "::notice::The Hugging Face mirror lacks some objects; fetching the rest from GitHub."
              git config lfs.url "${github}"
              git lfs pull --include="${LFS_INCLUDE}"
            fi
            ;;
          *)
            echo "::error::unknown LFS store: ${STORE}"
            exit 1
            ;;
        esac
    # A fork's pull request must not choose the environment its own data is
    # validated in, so a fork run builds from the base branch. Every other run
    # builds from github.sha -- the merge commit on a pull request -- so a
    # uv.lock bump and a change to how the validator is invoked are tested
    # together. Anyone who can open a same-repo pull request can already edit
    # this file.
    - name: Check out the pipeline
      if: steps.leg.outputs.datasets != '0'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: >-
          ${{ github.event.pull_request.head.repo.fork
              && github.event.pull_request.base.ref || github.sha }}
        path: pipeline
        lfs: false
        # Only what `uv sync` reads. Leaving out data/ also keeps a second tree
        # of dataset pointer files from sitting under the workspace.
        sparse-checkout: |
          .python-version
          pyproject.toml
          uv.lock
        sparse-checkout-cone-mode: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      if: steps.leg.outputs.datasets != '0'
      with:
        enable-cache: true
    - name: Install ord_schema
      if: steps.leg.outputs.datasets != '0'
      working-directory: pipeline
      run: uv sync --only-group pipeline --locked
    # The interpreter is invoked directly rather than through `uv run`, which
    # would rediscover the checked-out tree's own pyproject.toml and hand the
    # environment back to the pull request.
    - name: Validate parquet datasets
      if: steps.leg.outputs.datasets != '0'
      env:
        FILTER: ${{ steps.leg.outputs.filter }}
        EXPECTED: ${{ steps.leg.outputs.datasets }}
      run: |
        set -euo pipefail
        cd "${GITHUB_WORKSPACE}"
        # validate_dataset.py logs "Found 0 datasets" and exits 0, so a filter
        # that stops selecting anything -- a typo in its character class, a
        # layout change under data/ -- reports a clean sweep over nothing. Count
        # the shard's share first, through the same glob and regex engine the
        # validator uses, and require exactly the share the leg step chose.
        ./pipeline/.venv/bin/python <<'PY'
        import glob
        import os
        import re
        import sys

        pattern = re.compile(os.environ["FILTER"])
        matched = [f for f in sorted(glob.glob("data/*/*.parquet")) if pattern.search(f)]
        expected = int(os.environ["EXPECTED"])
        print(f"shard covers {len(matched)} datasets")
        if len(matched) != expected:
            sys.exit(f"shard filter selects {len(matched)} datasets, not {expected}")
        PY
        ./pipeline/.venv/bin/python -m ord_schema.scripts.validate_dataset \
          --input_pattern="data/*/*.parquet" \
          --filter="${FILTER}" \
          --n_jobs=4 \
          --validate_ids
