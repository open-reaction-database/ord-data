# Runs process_dataset.py on all new and changed files.
#
# Submissions from forks only trigger the "validation" step to validate the new
# data. After merging into a new branch in the parent repo, the workflow will
# run again and trigger the "update" step to add reaction IDs, etc. in
# preparation for merging into the "main" branch.

name: Submission

on:
  pull_request:
    # Default trigger types plus labeled/unlabeled so adding or removing the
    # `skip-update-submission` label re-runs the workflow with the new
    # gating on the "Update submission" step, and edited so that
    # retarget_submission.yml moving a submission off main re-runs these checks
    # against the new base. Jobs ignore edits that did not change the base.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

# One in-flight run per PR. New events (pushes, label toggles) cancel
# the prior run so we are not paying twice for things like LFS checkouts.
concurrency:
  group: submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Dataset files a submission may contain: protobuf binary (.pb/.binpb) or
  # text (.pbtxt/.txtpb), either optionally gzipped, plus Parquet. The
  # check_file_types job rejects anything else, check_target_branch decides
  # whether a fork's pull request is a data submission, and process_submission
  # selects the files it processes -- all with this pattern, so they must
  # agree: a suffix accepted by one but not the others either fails a
  # legitimate submission or silently processes nothing.
  #
  # retarget_submission.yml carries the same value and tests.yml fails if the
  # two drift. It cannot be shared through a file because a `pull_request` run
  # checks out the merge ref, so the file would be the fork's copy and
  # weakening it to `.*` would defeat check_file_types.
  DATASET_FILE_PATTERN: '\.(pb|binpb|pbtxt|txtpb)(\.gz)?$|\.parquet$'

jobs:
  check_file_types:
    # An edit that left the base alone (a retitled pull request, say) changes
    # nothing these jobs look at. process_submission needs this job, so
    # skipping here skips the LFS checkout below it too.
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Add upstream for comparisons to HEAD
      run: |
        cd "${GITHUB_WORKSPACE}"
        git remote add upstream \
          "https://github.com/Open-Reaction-Database/${GITHUB_REPOSITORY##*/}.git"
        echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
        git fetch --no-tags --prune --depth=1 upstream \
          +refs/heads/*:refs/remotes/upstream/*
    - name: Check changed files (PR from fork)
      run: |
        cd "${GITHUB_WORKSPACE}"
        git diff --name-only upstream/main > changed_files.txt
        grep -vE "${DATASET_FILE_PATTERN}" changed_files.txt && \
          echo "Error: submissions should only contain *.pb, *.binpb, *.pbtxt, or *.txtpb files (optionally gzipped), or *.parquet files" && \
          exit 1 || true
      if: github.event.pull_request.head.repo.fork

  check_target_branch:
    # A data submission from a fork must not target main: the Update submission
    # step cannot push processed commits back to a fork, so submissions are
    # merged into an ord-owned "#<number>" branch first and that branch opens
    # the pull request against main. retarget_submission.yml does this move
    # automatically, so failing here means it did not run or could not finish.
    #
    # Fork pull requests that change no dataset files are ordinary
    # contributions -- documentation, workflows, scripts -- and target main
    # like any other.
    #
    # Deliberately not run on opened/reopened, where retarget_submission.yml is
    # already moving the submission: it repoints with GITHUB_TOKEN, and events
    # from that token start no workflow run, so a failure recorded here would
    # never be re-run and would sit red on a pull request that had in fact been
    # fixed seconds later. Every later event still checks.
    if: >-
      github.event.pull_request.head.repo.fork &&
      github.event.action != 'opened' &&
      github.event.action != 'reopened' &&
      (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-latest
    steps:
    - name: Check target branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        echo "Target branch: ${GITHUB_BASE_REF}"
        if [[ "${GITHUB_BASE_REF}" != "main" ]]; then
          exit 0
        fi
        # Collected before matching: under pipefail, `gh | grep -q` can report
        # the SIGPIPE from grep's early exit on a match.
        FILES="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
          --jq '.[].filename')"
        if printf '%s\n' "${FILES}" | grep -qE "${DATASET_FILE_PATTERN}"; then
          echo "Error: a data submission from a fork cannot target main; it" \
            "belongs on a '#${PR_NUMBER}' branch in this repository so the" \
            "submission workflow can push the processed dataset back to it."
          exit 1
        fi
        echo "No dataset files changed; targeting main is fine."

  process_submission:
    # This job runs scripts/process_dataset.py from the pull request's own
    # checkout, so it must not start until check_file_types has confirmed that a
    # fork's submission contains dataset files and nothing else.
    needs: check_file_types
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ord-data
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        lfs: false
    - name: Add upstream for comparisons to HEAD
      run: |
        cd "${GITHUB_WORKSPACE}"
        git remote add upstream \
          "https://github.com/Open-Reaction-Database/${GITHUB_REPOSITORY##*/}.git"
        echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
        git fetch --no-tags --prune --depth=1 upstream \
          +refs/heads/*:refs/remotes/upstream/*
    # The "Update submission" step below pushes its own commit. When that push
    # is authenticated with SUBMISSION_TOKEN it re-runs this workflow, which
    # would otherwise process an already-processed submission. That is harmless
    # -- update_dataset only assigns IDs that are not already canonical, so the
    # second pass changes nothing and the commit below finds nothing to commit
    # -- but it repeats the LFS pull for no reason, so the re-run validates the
    # result instead of rewriting it.
    - name: Identify the author of the head commit
      id: head_commit
      run: |
        cd "${GITHUB_WORKSPACE}"
        AUTHOR="$(git log -1 --format=%ae)"
        echo "Head commit author: ${AUTHOR}"
        if [[ "${AUTHOR}" == "github-actions@github.com" ]]; then
          echo "from_workflow=true" >> "$GITHUB_OUTPUT"
        else
          echo "from_workflow=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Identify changed files
      # NOTE(kearnes): This sets the NUM_CHANGED_FILES variable.
      run: |
        cd "${GITHUB_WORKSPACE}"
        git diff --name-status upstream/main > changed_files.txt
        echo "Found $(wc -l < changed_files.txt | tr -d ' ') changed files"
        cat changed_files.txt
        # Use `|| (( $? == 1 ))` in case no lines match (exit code is nonzero).
        grep -E "${DATASET_FILE_PATTERN}" changed_files.txt > changed_data_files.txt || (( $? == 1 ))
        # Use LOCAL_NUM_CHANGED since ::set-env values are not available immediately.
        LOCAL_NUM_CHANGED="$(wc -l < changed_data_files.txt | tr -d ' ')"
        echo "NUM_CHANGED_FILES=${LOCAL_NUM_CHANGED}" >> $GITHUB_ENV
        echo "Found ${LOCAL_NUM_CHANGED} changed dataset files"
        cat changed_data_files.txt
    # Read LFS from GitHub, not the HF mirror that .lfsconfig points clones at:
    # submissions are validated before their bytes are mirrored to HF on merge
    # to main, and the "Update submission" step's uploads reuse this lfs.url
    # override (.lfsconfig has no pushurl). Only the changed datasets are
    # pulled: process_dataset reads just these inputs, and base revisions of
    # modified files are smudged on demand through the same lfs.url, so the
    # rest of the repository is never needed. Skipped entirely when no dataset
    # files changed.
    - name: Fetch changed LFS objects from GitHub
      if: env.NUM_CHANGED_FILES != '0'
      run: |
        cd "${GITHUB_WORKSPACE}"
        git config lfs.url "https://github.com/${GITHUB_REPOSITORY}.git/info/lfs"
        # changed_data_files.txt holds `git diff --name-status` lines; the last
        # field is the current path (the new path for renames). Paths without an
        # LFS object at HEAD (root submissions, deletions) are no-ops here.
        INCLUDE="$(awk '{print $NF}' changed_data_files.txt | paste -sd, -)"
        echo "Pulling LFS objects for changed datasets: ${INCLUDE}"
        git lfs pull --include="${INCLUDE}"
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
      if: env.NUM_CHANGED_FILES != '0'
    # process_dataset.py needs the schema library and pygithub; --only-group
    # skips the project's own runtime deps and the lint/test toolchain. The
    # runs below pass --no-sync so they use exactly this environment.
    - name: Install dependencies
      run: uv sync --only-group pipeline --locked
      if: env.NUM_CHANGED_FILES != '0'
    - name: Validate submission
      run: |
        cd "${GITHUB_WORKSPACE}"
        uv run --no-sync python scripts/process_dataset.py \
          --input_file=changed_data_files.txt \
          --base=upstream/main
      # Also covers the re-run caused by this workflow's own push: the datasets
      # are already processed, so the useful check on them is validation.
      if: >-
        env.NUM_CHANGED_FILES != '0' &&
        (github.event.pull_request.head.repo.fork ||
         steps.head_commit.outputs.from_workflow == 'true')
    # A push authenticated with GITHUB_TOKEN starts no workflow run, so the
    # commit written by "Update submission" arrives with no CI and the pull
    # request has to be closed and reopened by hand to get any. An app
    # installation token is a different identity, so its push triggers runs
    # normally. The app needs Contents: read and write on this repository alone
    # -- never on a contributor's fork, since the push below goes to the
    # "#<number>" branch here.
    #
    # Deliberately not minted on a fork's run. "Update submission" is gated on
    # `! ...fork` and so never uses it there, and this job checks out and
    # executes scripts/process_dataset.py from the pull request's own checkout:
    # on a fork that file is contributor-controlled. check_file_types already
    # rejects a fork submission that touches anything but dataset files, but a
    # writable token simply should not be in the environment on that path.
    #
    # Skipped when the app is not configured, leaving PUSH_TOKEN to fall back to
    # GITHUB_TOKEN so the step behaves exactly as it does today.
    - name: Mint a token whose push can re-trigger CI
      id: push_token
      if: >-
        vars.SUBMISSION_APP_ID != '' &&
        ! github.event.pull_request.head.repo.fork
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ vars.SUBMISSION_APP_ID }}
        private-key: ${{ secrets.SUBMISSION_APP_PRIVATE_KEY }}
    - name: Update submission
      env:
        PUSH_TOKEN: ${{ steps.push_token.outputs.token || secrets.GITHUB_TOKEN }}
      run: |
        cd "${GITHUB_WORKSPACE}"
        uv run --no-sync python scripts/process_dataset.py \
          --input_file=changed_data_files.txt \
          --update \
          --cleanup \
          --base=upstream/main \
          --issue=${{ github.event.number }} \
          --token=${{ secrets.GITHUB_TOKEN }}
        git config user.name github-actions
        git config user.email github-actions@github.com
        # Fail gracefully if there is nothing to commit.
        git commit -a -m "Update submission" || (( $? == 1 ))
        # actions/checkout leaves its own credential in an http.extraheader,
        # which would authenticate this push as GITHUB_TOKEN no matter what the
        # URL says. Clearing it for this one command is what lets PUSH_TOKEN
        # actually be the pushing identity.
        git -c "http.https://github.com/.extraheader=" \
          push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "HEAD:${GITHUB_HEAD_REF}"
      # Skipped when the PR carries the `skip-update-submission` label, so
      # maintainer PRs that touch dataset files but do not need ID/timestamp
      # assignment (e.g. format conversions) can land without process_dataset
      # rewriting the inputs. Also skipped on the re-run triggered by this
      # step's own push, which would otherwise reprocess a processed
      # submission; "Validate submission" above covers that run instead.
      if: >-
        env.NUM_CHANGED_FILES != '0' &&
        ! github.event.pull_request.head.repo.fork &&
        steps.head_commit.outputs.from_workflow != 'true' &&
        ! contains(github.event.pull_request.labels.*.name, 'skip-update-submission')
