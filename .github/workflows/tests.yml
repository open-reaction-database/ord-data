# Lints and tests the helper scripts under scripts/.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ord-data
      uses: actions/checkout@v4
      # The tests exercise pure functions and build their own fixtures under
      # tmp_path, so no dataset objects are needed.
      with:
        lfs: false
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: uv sync --group dev --locked
    - name: ruff check
      run: uv run ruff check .
    - name: ruff format
      run: uv run ruff format --check .
    - name: ty check
      run: uv run ty check
    - name: pytest
      run: uv run pytest -n auto -ra
